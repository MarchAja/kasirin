name: Release Windows

# Bangun paket Windows setiap kali tag v* didorong (mis. v0.1.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Bangun ZIP + installer NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Siapkan Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 tidak punya biner siap pakai untuk semua versi Node di Windows.
      # Tanpa lingkungan MSVC, node-gyp gagal walaupun Visual Studio terpasang.
      - name: Siapkan alat C++ (node-gyp)
        uses: ilammy/msvc-dev-cmd@v1

      # build-windows.ps1 yang menangani npm ci, kompilasi modul native dengan
      # node-gyp 13, build, ZIP, dan NSIS (lihat skrip untuk detailnya).

      # Pilihan yang dipakai: choco install nsis -y (bukan binary-builder).
      - name: Pasang NSIS
        run: |
          choco install nsis -y
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (Test-Path $nsis) { $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }

      - name: Bangun paket Windows
        run: powershell -File scripts/build-windows.ps1

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: kasirin-windows
          path: dist-windows/KasirIn-windows.zip
          if-no-files-found: error

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-windows/KasirIn-windows.zip
          generate_release_notes: true
          body: |
            Paket KasirIn untuk Windows (${{ github.ref_name }}).

            - `KasirIn-windows.zip` — versi portabel berisi `node_modules`.
              Ekstrak lalu jalankan `run.cmd`; tidak perlu `npm ci` atau Visual
              Studio Build Tools. Cukup Node.js 22+ terpasang. Panduan ada di bawah.

            **Installer `.exe` — coming soon.** Untuk sementara gunakan ZIP dan
            ikuti panduan instalasi manual:
            https://github.com/MarchAja/kasirin#instalasi-manual-windows

            Butuh Node.js 22 atau lebih baru. Data tersimpan di `%LOCALAPPDATA%\KasirIn\data`.
            Panduan lengkap: https://github.com/MarchAja/kasirin/blob/main/docs/DEPLOYMENT.md

            Lisensi AGPL-3.0 — https://github.com/MarchAja/kasirin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
