<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>KasirIn — Pilih Addon</title>
<link rel="stylesheet" href="tokens.css?v=3">
<link rel="stylesheet" href="mobile.css?v=3">
<link rel="stylesheet" href="watermark.css">
<meta name="author" content="MarchAja">
<!-- Mockup KasirIn oleh MarchAja · Open Source · AGPL-3.0 -->
</head>
<body>
<div class="phone">
  <header class="top">
    <div>
      <h1>Warung Bu Sri</h1>
      <div class="meta">
        <span class="pill pill--green"><i class="dot dot--served"></i>Buka</span>
        <span class="tbl">Meja 7 · makan di tempat</span>
      </div>
    </div>
    <button class="cart" aria-label="Keranjang, 2 item">
      <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="badge num">2</span>
    </button>
  </header>

  <div class="search" role="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
    Cari menu, mis. nasi goreng
  </div>

  <nav class="chips" aria-label="Kategori menu">
    <button class="chip chip--on">Semua</button>
    <button class="chip">Makanan</button>
    <button class="chip">Minuman</button>
  </nav>
</div>

<dialog class="sheet" id="addon" aria-labelledby="addon-title" closedby="any">
  <div class="wm wm--sheet" aria-hidden="true">
    <span class="wm-mark">K</span>
    <span>KasirIn</span><span class="wm-sep">·</span><b>@MarchAja</b>
    <span class="wm-sep">·</span><span>Open Source</span>
  </div>
  <button class="close" aria-label="Tutup" onclick="this.closest('dialog').close()">×</button>
  <div class="sheet-inner">
    <div class="grab"></div>

    <div class="ihead">
      <img src="img/nasi-goreng.jpg" alt="">
      <div class="it">
        <b id="addon-title">Nasi Goreng</b>
        <span class="tag">Paling laris</span>
      </div>
      <span class="ip num">Rp25.000</span>
    </div>

    <div class="group">
      <span class="label">Tambahan <span>(opsional)</span></span>
      <button class="opt opt--on">
        <span class="radio"></span>
        <span>Tanpa tambahan</span>
        <span class="oprice num">Rp0</span>
      </button>
      <button class="opt">
        <span class="radio"></span>
        <span>Telur ceplok</span>
        <span class="oprice num">+Rp5.000</span>
      </button>
      <button class="opt">
        <span class="radio"></span>
        <span>Keju</span>
        <span class="oprice num">+Rp8.000</span>
      </button>
      <button class="opt">
        <span class="radio"></span>
        <span>Sosis</span>
        <span class="oprice num">+Rp7.000</span>
      </button>
    </div>

    <div class="group">
      <span class="label">Level pedas <span>(pilih satu)</span></span>
      <button class="opt opt--on">
        <span class="radio"></span>
        <span>Tidak pedas</span>
        <span class="oprice num">Rp0</span>
      </button>
      <button class="opt">
        <span class="radio"></span>
        <span>Pedas sedang</span>
        <span class="oprice num">Rp0</span>
      </button>
      <button class="opt">
        <span class="radio"></span>
        <span>Pedas maksimal</span>
        <span class="oprice num">Rp0</span>
      </button>
    </div>

    <div class="note">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
      Catatan · mis. tanpa bawang
    </div>

    <div class="qtyrow">
      <span>Jumlah</span>
      <div class="stepper">
        <button aria-label="Kurangi">−</button>
        <span class="n num">1</span>
        <button aria-label="Tambah">+</button>
      </div>
    </div>

    <button class="btn btn--primary">Tambah · Rp25.000</button>
  </div>
</dialog>

<script>
  const sheet = document.querySelector("#addon");
  sheet.showModal();
  // Mockup statis: selesaikan animasi masuk agar screenshot menangkap keadaan akhir,
  // dan lepaskan fokus awal supaya cincin fokus tidak terbaca sebagai state terpilih.
  requestAnimationFrame(() => {
    sheet.getAnimations({ subtree: true }).forEach((a) => a.finish());
    if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
  });
</script>

<div class="wm" aria-hidden="true">
  <span class="wm-mark">K</span>
  <span>KasirIn</span><span class="wm-sep">·</span><b>@MarchAja</b>
  <span class="wm-sep">·</span><span>Open Source</span>
  <span class="wm-sep">·</span><span>AGPL-3.0</span>
</div>
</body>
</html>
